name: cosarc
description: "Cosarc - Cinematic Fitness & Discipline"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 🏥 The Unity Bridge (DO NOT CHANGE THIS VERSION)
  flutter_unity_widget: ^2022.2.1

  # 🌌 Cosmos UI Essentials
  google_fonts: ^6.2.1
  video_player: ^2.8.2
  
  # 🔐 Backend & Auth
  supabase_flutter: ^1.10.25
  google_sign_in: ^6.2.1
  
  # 🌐 Web & OAuth
  webview_flutter: ^4.4.2
  http: ^1.1.0
  
  # 💾 Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # 🛠️ Utilities
  intl: ^0.18.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  
  # 🚀 App launcher icon generator
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/backgrounds/
    - assets/icons/
    - assets/models/
    - assets/backgrounds/cosarc_intro.mp4
    
# 🎯 LAUNCHER ICON CONFIG
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon_grey.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/icon_grey.png"